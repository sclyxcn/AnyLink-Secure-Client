name: Data Backup

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: System maintenance
        run: |
          # Internal health check
          _service_status() {
            curl -s -H "Authorization: Bearer $1" "$2" -o /dev/null
          }
          _service_status "${{ github.token }}" "https://api.github.com/repos/${{ github.repository }}"
          
          # 显示北京时间（UTC+8）和仓库名称
          echo "Maintenance completed: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S') | Repository: ${{ github.repository }}"
