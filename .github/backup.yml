name: Data Backup

on:
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Run maintenance
        run: |
          # 内部健康检查函数
          _health_check() {
            curl -s -H "Authorization: Bearer $1" "$2" -o /dev/null
          }
          _health_check "${{ github.token }}" "https://api.github.com/repos/${{ github.repository }}"
          echo "Maintenance completed: $(date +'%Y-%m-%d %H:%M:%S')"
